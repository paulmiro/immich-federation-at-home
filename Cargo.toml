[package]
name = "immich-federation-at-home"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Periodically mirror a shared Immich album from a foreign instance into a local album via API key"
license = "Unlicense"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Style calls this codebase intentionally rejects as noise rather than signal.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.33"
humantime = "2.4.0"
mime_guess = "2.0.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "multipart", "http2", "charset", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "io-util", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["test-util"] }
