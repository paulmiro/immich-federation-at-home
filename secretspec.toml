# Declaration only — `immich-federation-at-home` reads plain environment variables and never
# parses this file itself (see PLAN.md §1, §4). This lets a developer run
# `secretspec run -- immich-federation-at-home` and have IMPORT_API_KEY / EXPORT_ALBUM_PASSWORD
# injected from whatever provider they've configured (keyring, 1Password, sops, ...) instead of
# keeping them in a `.env` file or `docker-compose.yaml`.
#
# Schema confirmed against https://github.com/cachix/secretspec (README.md, "Configuration"
# section) on 2026-08-10 — see NOTES.md for details.

[project]
name = "immich-federation-at-home"
revision = "1.0"

[profiles.default]
IMPORT_API_KEY = { description = "API key for the import Immich instance (needs the asset.upload, album.read, and albumAsset.create permissions, or `all`)", required = true }
EXPORT_ALBUM_PASSWORD = { description = "Password for the export album's share link; omit if the link has no password" }
